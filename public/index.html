<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vault Stockroom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap">
<link rel="stylesheet" href="style.css">
<script src="theme.js"></script>
</head>
<body>
<div class="wrap">

  <div class="boot crt-flicker" id="boot"></div>

  <header class="masthead" id="masthead" style="display:none;">
    <div class="camp-name" id="campName">CAMP NAME</div>
    <div class="meta-row">
      <span><span class="k">IN-GAME NAME:</span> <span class="v" id="ign">-</span></span>
      <span><span class="k">DISCORD:</span> <span class="v" id="discord">-</span></span>
      <span><span class="k">PLATFORM:</span> <span class="v" id="server">-</span></span>
    </div>
    <p class="tagline" id="tagline"></p>
    <p class="note" id="note"></p>
    <div class="trade-banner" id="tradeBanner" style="display:none;"></div>
  </header>

  <nav class="nav-row" id="navRow" style="display:none;">
    <a href="index.html" class="active">CATALOG</a>
    <a href="contact.html">REQUEST</a>
    <span class="theme-slot" id="themeSlot"></span>
  </nav>

  <div class="controls" id="controls" style="display:none;">
    <input type="text" class="search-box" id="search" placeholder="SEARCH ITEMS / MODS..." aria-label="Search items and mods">
    <label class="toggle" id="toggleLabel">
      <input type="checkbox" id="showUnavailable">
      SHOW OUT-OF-STOCK
    </label>
  </div>

  <main id="catalog"></main>

  <div class="footer">
    <span>VAULT STOCKROOM // <span id="lastUpdated"></span></span>
    <span><a class="github-footer-link" href="https://github.com/i-01000011-01001010/vault-stockroom" target="_blank" rel="noopener">Vault Stockroom on GitHub</a></span>
    <span class="legal">In-game trading only. No real-world money. Not affiliated with Bethesda.</span>
    <span class="credit">Project by <a href="https://i-01000011-01001010.dev/" target="_blank" rel="noopener">i-01000011-01001010</a></span>
  </div>
</div>

<div class="cart-bar" id="cartBar">
  <span class="count" id="cartCount">0 ITEMS SELECTED</span>
  <span class="spacer"></span>
  <button type="button" id="cartClearBtn">CLEAR</button>
  <button type="button" class="primary" id="cartReviewBtn">REVIEW REQUEST &rarr;</button>
</div>

<script src="notice.js"></script>
<script src="catalog.js"></script>
<script src="cart.js"></script>
<script src="script.js"></script>
</body>
</html>
