<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin :: Vault Stockroom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap">
<link rel="stylesheet" href="style.css">
<script src="theme.js"></script>
</head>
<body>
<div class="wrap">

  <header class="masthead">
    <div class="camp-name">ADMIN</div>
    <p class="tagline" id="who">Checking sign-in...</p>
  </header>

  <nav class="nav-row">
    <a href="index.html">VIEW SITE</a>
    <a href="admin.html" class="active">ADMIN</a>
    <span class="theme-slot" id="themeSlot"></span>
  </nav>

  <div class="tabs" role="tablist" id="tabs">
    <button type="button" class="tab active" data-tab="stock">STOCK</button>
    <button type="button" class="tab" data-tab="sections">SECTIONS</button>
    <button type="button" class="tab" data-tab="site">SITE</button>
    <button type="button" class="tab" data-tab="backup">BACKUP</button>
    <button type="button" class="tab" data-tab="activity">ACTIVITY</button>
  </div>
  <div class="msg" id="topMsg" role="status"></div>
  <main id="adminMain"></main>

  <div class="footer">
    <span>VAULT STOCKROOM // ADMIN</span>
    <span><a class="github-footer-link" href="https://github.com/i-01000011-01001010/vault-stockroom" target="_blank" rel="noopener">Vault Stockroom on GitHub</a></span>
    <span class="legal">In-game trading only. No real-world money. Not affiliated with Bethesda.</span>
    <span class="credit">Project by <a href="https://i-01000011-01001010.dev/" target="_blank" rel="noopener">i-01000011-01001010</a></span>
  </div>
</div>

<div class="savebar" id="saveBar">
  <span id="saveCount">0 unsaved changes</span>
  <span class="spacer"></span>
  <button type="button" class="btn" id="discardBtn">DISCARD</button>
  <button type="button" class="btn primary" id="saveBtn">SAVE CHANGES</button>
</div>
<script src="admin.js"></script>
</body>
</html>
