name = "vault-stockroom"
main = "src/index.js"
compatibility_date = "2026-08-01"

# Optional: attach your own domain once it is set up in Cloudflare, otherwise
# you get a *.workers.dev address on first deploy.
# routes = [
#   { pattern = "stockroom.yourdomain.com", custom_domain = true }
# ]

# Static site files. Requests under /api/ always run the Worker first.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# D1 database. Create it once with:
#   npx wrangler d1 create vault-stockroom
# then paste the database_id it prints below.
[[d1_databases]]
binding = "DB"
database_name = "vault-stockroom"

# Admin login runs through Cloudflare Access (see README). Fill these in after
# you create the Access application. Leave empty and the admin stays locked.
[vars]
ACCESS_TEAM_DOMAIN = ""   # e.g. yourteam.cloudflareaccess.com
ACCESS_AUD = ""           # Application Audience (AUD) tag from the Access application
ADMIN_EMAILS = ""         # optional extra lock, comma separated emails allowed as admin
